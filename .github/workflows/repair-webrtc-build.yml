name: Repair WebRTC build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix nullable JsonElement in WebRTC receive loop
        shell: python
        run: |
          from pathlib import Path
          p = Path('agent/Program.cs')
          s = p.read_text(encoding='utf-8')
          old = '''            var message = await ReceiveJson(ws, cancellationToken);\n            if (message is null) break;\n            var type = GetString(message, "type");\n            try\n            {\n                if (type == "webrtc.offer") await HandleOffer(ws, message, cancellationToken);\n                else if (type == "webrtc.candidate") HandleCandidate(message);'''
          new = '''            var message = await ReceiveJson(ws, cancellationToken);\n            if (message is null) break;\n            var value = message.Value;\n            var type = GetString(value, "type");\n            try\n            {\n                if (type == "webrtc.offer") await HandleOffer(ws, value, cancellationToken);\n                else if (type == "webrtc.candidate") HandleCandidate(value);'''
          if new in s:
              print('Repair already applied; nothing to change.')
          elif old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Applied nullable WebRTC repair.')
          else:
              raise SystemExit('WebRTC receive loop is neither in the old broken form nor the repaired form.')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/Program.cs
          if git diff --cached --quiet; then
            echo 'No repair needed.'
          else
            git commit -m 'Fix nullable WebRTC message handling'
            git push origin HEAD:main
          fi
