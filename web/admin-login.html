<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My-Level — Admin Login</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell narrow"><a class="back" href="/">← My computer</a><section class="card"><div class="eyebrow">ADMIN ACCESS</div><h1>Administrator login</h1><p>Only the authorized My-Level administrator can access all connected computers.</p><form id="loginForm"><label for="password">Admin password</label><div style="position:relative;margin:12px 0 18px"><input id="password" name="password" type="password" autocomplete="current-password" required style="display:block;width:100%;padding:14px 82px 14px 14px;border:1px solid #d9dee8;border-radius:12px;box-sizing:border-box"><button type="button" id="togglePassword" aria-label="Show password" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:8px 10px;cursor:pointer;color:#555;font-weight:600">Show</button></div><button class="button" type="submit">Continue to Admin</button><p id="error" class="muted" style="margin-top:14px"></p></form></section></main><script>const API='https://my-level-api.onrender.com';const password=document.querySelector('#password');const toggle=document.querySelector('#togglePassword');toggle.addEventListener('click',()=>{const hidden=password.type==='password';password.type=hidden?'text':'password';toggle.textContent=hidden?'Hide':'Show';toggle.setAttribute('aria-label',hidden?'Hide password':'Show password')});document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Login failed');localStorage.setItem('myLevelAdminToken',data.token);location.href='/admin.html'}catch(err){error.textContent=err.message||'Login failed'}});</script></body></html>
