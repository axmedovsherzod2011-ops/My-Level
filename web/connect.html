<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add this PC — My-Level</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell narrow"><a class="back" href="/">← My computer</a><section class="card"><div class="eyebrow">THIS COMPUTER</div><h1>Add this PC</h1><p>Download and run the authorized Windows Agent on this computer, then enter the one-time code below.</p><button id="generate" class="button">Generate pairing code</button><div id="code" class="code">------</div><p id="expires" class="muted"></p><div class="notice">Screen sharing starts only after you explicitly enable it in the Agent.</div><div style="margin-top:20px"><a class="button" href="/agent-download">Download Windows Agent</a></div></section></main><script>const API='https://my-level-api.onrender.com',key='my-level-owner';let owner=localStorage.getItem(key);if(!owner){owner=crypto.randomUUID();localStorage.setItem(key,owner)}document.querySelector('#generate').onclick=async()=>{const b=document.querySelector('#generate');b.disabled=true;try{const r=await fetch(API+'/api/pairing-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ownerToken:owner})});if(!r.ok)throw 0;const d=await r.json();document.querySelector('#code').textContent=d.code;document.querySelector('#expires').textContent='Expires in 5 minutes and can be used once.'}catch{document.querySelector('#expires').textContent='Could not connect to My-Level. Try again.'}finally{b.disabled=false}};</script></body></html>
